name: Build Ollama IBKR Trader

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Se preenchido (ex.: trader-v1.0.0), cria uma Release com os executáveis"
        required: false
        default: ""
  push:
    branches: ["claude/trading-system-ollama-ibkr-3qzwm3", "main"]
    paths: ["ollama-ibkr-trader/**", ".github/workflows/build-trader.yml"]
    tags: ["trader-v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ollama-ibkr-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OllamaIBKRTrader-windows
            binary: dist/OllamaIBKRTrader.exe
          - os: macos-latest
            artifact: OllamaIBKRTrader-macos
            binary: dist/OllamaIBKRTrader
          - os: ubuntu-latest
            artifact: OllamaIBKRTrader-linux
            binary: dist/OllamaIBKRTrader
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ollama-ibkr-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean --noconfirm trader.spec
      - name: Smoke test (binary imports and starts)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ${{ matrix.binary }}
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ollama-ibkr-trader/${{ matrix.binary }}
          if-no-files-found: error
      - name: Rename binary with platform suffix
        shell: bash
        run: |
          mkdir -p release
          case "${{ runner.os }}" in
            Windows) cp dist/OllamaIBKRTrader.exe release/OllamaIBKRTrader-windows-x64.exe ;;
            macOS)   cp dist/OllamaIBKRTrader release/OllamaIBKRTrader-macos ;;
            Linux)   cp dist/OllamaIBKRTrader release/OllamaIBKRTrader-linux-x64 ;;
          esac
          ls -la release/
      - name: Attach to release (tag push or manual release_tag)
        if: startsWith(github.ref, 'refs/tags/trader-v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Ollama IBKR Trader ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Executáveis compilados pelo GitHub Actions a partir de `ollama-ibkr-trader/` (commit ${{ github.sha }}).
            Windows: `OllamaIBKRTrader-windows-x64.exe`. Requer TWS/IB Gateway com API ativa e Ollama a correr localmente.
          files: ollama-ibkr-trader/release/*
